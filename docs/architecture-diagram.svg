  <rect x="35" y="182" width="260" height="160" rx="8" fill="white" stroke="#FF6A00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="35" y="182" width="260" height="28" rx="8" fill="#FF6A00"/>
  <rect x="35" y="198" width="260" height="12" fill="#FF6A00"/>
  <text x="165" y="200" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Drill Editor Engine</text>
  <text x="55" y="224" font-size="9" fill="#263238">DrillEditorPage.tsx</text>
  <text x="55" y="238" font-size="9" fill="#555">PitchCanvas.tsx (Konva, SSR-disabled)</text>
  <text x="55" y="252" font-size="9" fill="#555">PaletteSidebar.tsx</text>
  <text x="55" y="266" font-size="9" fill="#555">InspectorPanel.tsx</text>
  <text x="55" y="280" font-size="9" fill="#555">DrillEditorTopBar.tsx</text>
  <text x="55" y="294" font-size="9" fill="#555">PlayerDock.tsx + FormationPicker.tsx</text>
  <text x="55" y="308" font-size="9" fill="#555">DrillMetaPanel.tsx</text>
  <text x="55" y="322" font-size="9" fill="#555">DrillsList.tsx</text>

