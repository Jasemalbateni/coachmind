  <text x="462" y="428" text-anchor="middle" font-size="8.5" fill="#555">coach-teams-v1</text>
  <text x="462" y="442" text-anchor="middle" font-size="8" fill="#888">teams, players</text>
  <text x="462" y="455" text-anchor="middle" font-size="8" fill="#888">color inheritance</text>

  <rect x="560" y="396" width="155" height="90" rx="7" fill="white" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="637" y="413" text-anchor="middle" font-size="10" fill="#8b5cf6" font-weight="bold">foldersStore</text>
  <text x="637" y="428" text-anchor="middle" font-size="8.5" fill="#555">coach-folders-v1</text>
  <text x="637" y="442" text-anchor="middle" font-size="8" fill="#888">folders, subcategories</text>

  <rect x="735" y="396" width="155" height="90" rx="7" fill="white" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
