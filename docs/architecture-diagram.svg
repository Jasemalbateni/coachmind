  <rect x="20" y="516" width="1060" height="60" rx="10" fill="#263238" opacity="0.06" stroke="#263238" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="35" y="533" font-size="11" fill="#263238" font-weight="bold" opacity="0.5">PERSISTENCE LAYER — BROWSER localStorage (SSR-safe adapter)</text>
  <rect x="55" y="540" width="140" height="24" rx="5" fill="#263238" opacity="0.15"/>
  <text x="125" y="556" text-anchor="middle" font-size="9" fill="#263238">coach-drills-v2</text>
  <rect x="215" y="540" width="145" height="24" rx="5" fill="#263238" opacity="0.15"/>
  <text x="287" y="556" text-anchor="middle" font-size="9" fill="#263238">coach-sessions-v2</text>
  <rect x="380" y="540" width="140" height="24" rx="5" fill="#263238" opacity="0.15"/>
  <text x="450" y="556" text-anchor="middle" font-size="9" fill="#263238">coach-teams-v1</text>
  <rect x="540" y="540" width="140" height="24" rx="5" fill="#263238" opacity="0.15"/>
  <text x="610" y="556" text-anchor="middle" font-size="9" fill="#263238">coach-folders-v1</text>
  <rect x="700" y="540" width="165" height="24" rx="5" fill="#263238" opacity="0.15"/>
  <text x="782" y="556" text-anchor="middle" font-size="9" fill="#263238">coach-season-plans-v1</text>
  <rect x="885" y="540" width="170" height="24" rx="5" fill="#263238" opacity="0.15"/>
  <text x="970" y="556" text-anchor="middle" font-size="9" fill="#263238">coach-calendar-v1</text>

  <!-- ── THIRD-PARTY LAYER ── -->
  <rect x="20" y="590" width="1060" height="110" rx="10" fill="#00B8D4" opacity="0.05" stroke="#00B8D4" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="35" y="608" font-size="11" fill="#00B8D4" font-weight="bold" opacity="0.8">THIRD-PARTY LIBRARIES</text>

  <rect x="35" y="615" width="180" height="70" rx="7" fill="white" stroke="#00B8D4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="634" text-anchor="middle" font-size="10" fill="#00B8D4" font-weight="bold">react-konva / konva</text>
  <text x="125" y="649" text-anchor="middle" font-size="8.5" fill="#555">Canvas 2D engine</text>
  <text x="125" y="663" text-anchor="middle" font-size="8" fill="#888">Stage / Layer / Transformer</text>
  <text x="125" y="676" text-anchor="middle" font-size="8" fill="#888">SSR-disabled (dynamic import)</text>

  <rect x="235" y="615" width="180" height="70" rx="7" fill="white" stroke="#FF6A00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="634" text-anchor="middle" font-size="10" fill="#FF6A00" font-weight="bold">@dnd-kit</text>
  <text x="325" y="649" text-anchor="middle" font-size="8.5" fill="#555">Drag and Drop</text>
  <text x="325" y="663" text-anchor="middle" font-size="8" fill="#888">Session timeline reorder</text>
  <text x="325" y="676" text-anchor="middle" font-size="8" fill="#888">Drill library sort/reorder</text>

  <rect x="435" y="615" width="180" height="70" rx="7" fill="white" stroke="#FFC857" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="525" y="634" text-anchor="middle" font-size="10" fill="#bf8c00" font-weight="bold">Zustand 4.5</text>
  <text x="525" y="649" text-anchor="middle" font-size="8.5" fill="#555">Global state management</text>
  <text x="525" y="663" text-anchor="middle" font-size="8" fill="#888">persist middleware</text>
  <text x="525" y="676" text-anchor="middle" font-size="8" fill="#888">SSR-safe storage adapter</text>

  <rect x="635" y="615" width="180" height="70" rx="7" fill="white" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="725" y="634" text-anchor="middle" font-size="10" fill="#8b5cf6" font-weight="bold">Next.js 14.2 (App Router)</text>
  <text x="725" y="649" text-anchor="middle" font-size="8.5" fill="#555">React 18 + TypeScript</text>
  <text x="725" y="663" text-anchor="middle" font-size="8" fill="#888">File-based routing</text>
  <text x="725" y="676" text-anchor="middle" font-size="8" fill="#888">dynamic() for SSR guard</text>

  <rect x="835" y="615" width="220" height="70" rx="7" fill="white" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="634" text-anchor="middle" font-size="10" fill="#22c55e" font-weight="bold">Tailwind CSS 3.4</text>
  <text x="945" y="649" text-anchor="middle" font-size="8.5" fill="#555">Utility-first styling</text>
  <text x="945" y="663" text-anchor="middle" font-size="8" fill="#888">Custom brand tokens</text>
  <text x="945" y="676" text-anchor="middle" font-size="8" fill="#888">brand-orange, brand-dark</text>

  <!-- Arrows between layers -->
  <line x1="550" y1="148" x2="550" y2="162" stroke="#00B8D4" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="358" x2="550" y2="372" stroke="#FF6A00" stroke-width="1.5" marker-end="url(#arrowhead-orange)"/>
  <line x1="550" y1="486" x2="550" y2="516" stroke="#263238" stroke-width="1.5" stroke-dasharray="4,2"/>
</svg>
