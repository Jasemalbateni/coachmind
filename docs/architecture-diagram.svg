  <text x="112" y="413" text-anchor="middle" font-size="10" fill="#FF6A00" font-weight="bold">drillsStore</text>
  <text x="112" y="428" text-anchor="middle" font-size="8.5" fill="#555">coach-drills-v2</text>
  <text x="112" y="442" text-anchor="middle" font-size="8" fill="#888">drills, steps, favorites</text>
  <text x="112" y="455" text-anchor="middle" font-size="8" fill="#888">CRUD + undo wrappers</text>
  <text x="112" y="468" text-anchor="middle" font-size="8" fill="#888">duplicate, toggleFavorite</text>

  <rect x="210" y="396" width="155" height="90" rx="7" fill="white" stroke="#00B8D4" stroke-width="1.5" filter="url(#shadow)"/>
