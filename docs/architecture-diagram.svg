<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00B8D4"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6A00"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="#F4F4F4"/>

  <!-- Title -->
  <rect x="0" y="0" width="1100" height="50" fill="#263238"/>
  <text x="550" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="white">Coach Drill Designer — System Architecture</text>

  <!-- ── BROWSER LAYER ── -->
  <rect x="20" y="65" width="1060" height="80" rx="10" fill="#263238" opacity="0.08" stroke="#263238" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="35" y="82" font-size="11" fill="#263238" font-weight="bold" opacity="0.5">BROWSER / CLIENT LAYER</text>

  <!-- NavBar -->
  <rect x="35" y="88" width="120" height="44" rx="6" fill="#263238" filter="url(#shadow)"/>
  <text x="95" y="111" text-anchor="middle" font-size="11" fill="white" font-weight="bold">NavBar</text>
  <text x="95" y="124" text-anchor="middle" font-size="9" fill="#ffffff80">5 routes</text>

  <!-- Pages -->
  <rect x="175" y="88" width="880" height="44" rx="6" fill="#FF6A00" opacity="0.12" stroke="#FF6A00" stroke-width="1"/>
  <text x="615" y="104" text-anchor="middle" font-size="10" fill="#FF6A00" font-weight="bold">NEXT.JS APP ROUTER PAGES</text>
  <text x="300" y="122" text-anchor="middle" font-size="9" fill="#263238">/drills</text>
  <text x="400" y="122" text-anchor="middle" font-size="9" fill="#263238">/drills/[id]</text>
  <text x="510" y="122" text-anchor="middle" font-size="9" fill="#263238">/sessions/[id]</text>
  <text x="630" y="122" text-anchor="middle" font-size="9" fill="#263238">/teams/[id]</text>
  <text x="740" y="122" text-anchor="middle" font-size="9" fill="#263238">/season-plans/[id]</text>
  <text x="860" y="122" text-anchor="middle" font-size="9" fill="#263238">/calendar</text>
  <text x="960" y="122" text-anchor="middle" font-size="9" fill="#263238">/sessions/[id]/print</text>

  <!-- ── COMPONENT LAYER ── -->
  <rect x="20" y="158" width="1060" height="200" rx="10" fill="#00B8D4" opacity="0.06" stroke="#00B8D4" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="35" y="175" font-size="11" fill="#00B8D4" font-weight="bold" opacity="0.8">COMPONENT LAYER</text>

