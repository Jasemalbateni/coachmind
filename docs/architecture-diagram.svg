  <rect x="315" y="182" width="230" height="28" rx="8" fill="#00B8D4"/>
  <rect x="315" y="198" width="230" height="12" fill="#00B8D4"/>
  <text x="430" y="200" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Session Builder</text>
  <text x="330" y="224" font-size="9" fill="#263238">SessionBuilderPage.tsx</text>
  <text x="330" y="238" font-size="9" fill="#555">SessionTimeline.tsx (@dnd-kit)</text>
  <text x="330" y="252" font-size="9" fill="#555">DrillPicker.tsx</text>
  <text x="330" y="266" font-size="9" fill="#555">SessionsList.tsx</text>
  <text x="330" y="280" font-size="9" fill="#555">SessionView.tsx</text>
  <text x="330" y="294" font-size="9" fill="#555">MiniPitchPreview.tsx</text>

