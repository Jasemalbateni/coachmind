  <rect x="565" y="182" width="230" height="160" rx="8" fill="white" stroke="#FFC857" stroke-width="2" filter="url(#shadow)"/>
  <rect x="565" y="182" width="230" height="28" rx="8" fill="#FFC857"/>
  <rect x="565" y="198" width="230" height="12" fill="#FFC857"/>
  <text x="680" y="200" text-anchor="middle" font-size="11" fill="#263238" font-weight="bold">Season &amp; Calendar</text>
  <text x="580" y="224" font-size="9" fill="#263238">SeasonPlanEditor.tsx</text>
  <text x="580" y="238" font-size="9" fill="#555">SeasonPlansList.tsx</text>
  <text x="580" y="252" font-size="9" fill="#555">CalendarPage.tsx</text>
  <text x="580" y="266" font-size="9" fill="#555">TeamPage.tsx / TeamsList.tsx</text>

