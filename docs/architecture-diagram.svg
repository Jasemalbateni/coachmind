  <text x="287" y="428" text-anchor="middle" font-size="8.5" fill="#555">coach-sessions-v2</text>
  <text x="287" y="442" text-anchor="middle" font-size="8" fill="#888">sessions, blocks</text>
  <text x="287" y="455" text-anchor="middle" font-size="8" fill="#888">reorderBlocks</text>

  <rect x="385" y="396" width="155" height="90" rx="7" fill="white" stroke="#FFC857" stroke-width="1.5" filter="url(#shadow)"/>
